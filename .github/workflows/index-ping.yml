name: 검색엔진 색인 요청

on:
  schedule:
    # 한국시간 08:23 ~ 22:23, 2시간마다 (예약 글이 공개되는 시간대)
    - cron: "23 23,1,3,5,7,9,11,13 * * *"
  workflow_run:
    workflows: ["구글 블로거 자동 발행"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: index-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 새 글 색인 요청 (Bing · Google · 네이버 목록)
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          IT_REFRESH_TOKEN: ${{ secrets.IT_REFRESH_TOKEN }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python tools/index_ping.py

      - name: 결과 저장 (실패 시 재푸시)
        run: |
          git config user.name blogger-bot
          git config user.email blogger-bot@users.noreply.github.com
          git add posts/indexed.json posts/index_report.md posts/naver_submit.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "색인 요청 결과 기록"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
