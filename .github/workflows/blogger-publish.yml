name: 구글 블로거 자동 발행

on:
  push:
    branches: [main]
    paths:
      - "posts/queue/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blogger-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 블로거에 발행
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_BLOG_URL: ${{ secrets.BLOGGER_BLOG_URL }}
        run: python publish.py
